[package]
name = "lsboard"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "ls で見える、wait で眠れる AI エージェントの状態ボード"
repository = "https://github.com/takuyayukat/lsboard"

[profile.release]
strip = true
lto = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
